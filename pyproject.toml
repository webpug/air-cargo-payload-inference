[project]
name = "cargo-index"
version = "0.1.0"
description = "Infer freighter departures and relative takeoff weight from public ADS-B data"
authors = [
    { name = "Web Pug", email = "wepbug@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "kaleido>=1.5.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "openap>=2.6.2",
    "orjson>=3.13.0",
    "plotly>=7.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "traffic>=2.13",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
